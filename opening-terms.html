<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Terms &middot; Altazor</title>
<meta name="description" content="Terms from the opening, each on the position that shows it.">
<style>
:root { --bg:#121212; --panel:#1a1a1a; --text:#e6e6e6; --muted:#9a9a9a;
        --line:#2b2b2b; --accent:#58a6ff;
        --sq-light:#a9b2be; --sq-dark:#5a6472;
        --subject:#f09b28; --target:#e0684b; --plan:#58a6ff; --zone:#f5d49a; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; }
.wrap { max-width:1240px; margin:0 auto; padding:32px 20px 60px; }
header.site { border-top:4px solid var(--accent); padding-top:22px; margin-bottom:26px;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
.brand { font-weight:700; font-size:20px; letter-spacing:.1em; text-decoration:none;
  color:var(--text); }
.brand:hover { color:var(--accent); }
nav.site a { color:var(--muted); text-decoration:none; font-size:14px; margin-right:14px; }
nav.site a:hover { color:var(--accent); }
h1 { margin:0 0 14px; font-size:26px; }

.controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 18px; }
.chip { font:inherit; font-size:13.5px; padding:6px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
.chip:hover { border-color:var(--accent); }
.chip[aria-selected="true"] { background:var(--accent); border-color:var(--accent);
  color:#0b1a2b; font-weight:600; }
.keys { color:var(--muted); font-size:12.5px; margin-left:6px; }

.boardcol { max-width:560px; }
.board-grid { display:grid;
  grid-template-columns:1.4em min(86vw, 520px);
  grid-template-rows:min(86vw, 520px) 1.4em;
  align-items:center; justify-items:center; }
.ranks, .files { display:grid; width:100%; height:100%; }
.ranks { grid-template-rows:repeat(8, 1fr); }
.files { grid-template-columns:repeat(8, 1fr); grid-column:2; }
.ranks span, .files span { display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#7c7c7c; font-variant-numeric:tabular-nums; }
.board { display:grid; grid-template-columns:repeat(8, 1fr); grid-template-rows:repeat(8, 1fr);
  width:100%; height:100%; border:1px solid #333; border-radius:4px; overflow:hidden; }
.sq { position:relative; display:flex; align-items:center; justify-content:center; }
.sq.l { background:var(--sq-light); }
.sq.d { background:var(--sq-dark); }
.sq[data-mark]::after { content:""; position:absolute; inset:0;
  box-shadow:inset 0 0 0 3px currentColor; background:currentColor; opacity:.38; }
.sq[data-mark="subject"] { color:var(--subject); }
.sq[data-mark="target"] { color:var(--target); }
.sq[data-mark="plan"] { color:var(--plan); }
.sq[data-mark="zone"] { color:var(--zone); }
.sq[data-mark="zone"]::after { opacity:.30; }
.heat { position:absolute; inset:0; background:var(--subject); pointer-events:none; }
.num { position:relative; z-index:1; font-size:min(4.2vw, 21px); font-weight:650;
  color:#101316; font-variant-numeric:tabular-nums; }
.pc { position:relative; z-index:1; font-size:min(10vw, 56px); line-height:1; user-select:none; }
.pc.w { color:#f6f6f4; -webkit-text-stroke:1.3px #15181c; text-shadow:0 0 1px #15181c; }
.pc.b { color:#15181c; text-shadow:0 0 2px rgba(255,255,255,.35); }

.turn { font-size:13px; color:var(--muted); margin:10px 0 0 1.4em; }
.legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin:12px 0 0 1.4em; }
.legend div { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
.swatch { width:13px; height:13px; border-radius:3px; background:currentColor; opacity:.6;
  box-shadow:inset 0 0 0 2px currentColor; }
.sw-subject { color:var(--subject); }
.sw-target { color:var(--target); }
.sw-plan { color:var(--plan); }
.sw-zone { color:var(--zone); }

.text { margin:30px 0 0; border-top:1px solid var(--line); padding-top:22px; max-width:72ch; }
.text h2 { font-size:21px; margin:0 0 2px; font-weight:650; }
.tagline { color:var(--muted); margin:0 0 16px; }
.text p { margin:0 0 14px; color:#d4d4d4; }
.moves { font-variant-numeric:tabular-nums; }

footer.site { margin-top:60px; padding-top:18px; border-top:1px solid var(--line);
  font-size:13px; color:var(--muted); }
footer.site a { color:var(--muted); }
footer.site a:hover { color:var(--accent); }
@media (max-width:520px) {
  .board-grid { grid-template-columns:1.2em min(90vw, 520px); grid-template-rows:min(90vw, 520px) 1.2em; }
  .pc.w { -webkit-text-stroke:.8px #15181c; }
}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <a class="brand" href="index.html">ALTAZOR</a>
  <nav class="site"><a href="chess.html">&larr; Chess</a>
  <a href="middlegame-terms.html">Middlegame Terms</a>
  <a href="endgame-terms.html">Endgame Terms</a>
  <a href="checkmates.html">Checkmates</a></nav>
</header>
<h1>Opening Terms</h1>
<div class="controls">
  <div class="chips" id="chips" role="tablist" style="display:contents"></div>
  <span class="keys">Arrow keys step through the terms.</span>
</div>

<div class="boardcol">
  <div class="board-grid">
    <div class="ranks" id="ranks"></div>
    <div class="board" id="board" role="img" aria-label="The position for the selected term"></div>
    <div class="files" id="files"></div>
  </div>
  <p class="turn" id="turn"></p>
  <div class="legend" id="legend"></div>
</div>

<div class="text diagram-text">
  <h2 id="name"></h2>
  <p class="tagline" id="tagline"></p>
  <div id="body"></div>
</div>

<footer class="site"><a href="index.html">Altazor</a> &middot; <a href="chess.html">Chess</a> &middot; Openings</footer>
</div>

<script>
const TERMS = [
  {
    "name": "Bad bishop",
    "tagline": "A bishop whose own pawns sit on the color it travels.",
    "fen": "r1b1kbnr/pp3ppp/1qn1p3/2ppP3/3P4/2P2N2/PP3PPP/RNBQKB1R",
    "turn": "French Advance, White to move",
    "marks": {
      "c8": "subject",
      "d5": "target",
      "e6": "target",
      "f7": "target",
      "c1": "subject",
      "c3": "plan",
      "d4": "plan",
      "e5": "plan"
    },
    "legend": [
      [
        "subject",
        "the two bishops in question"
      ],
      [
        "target",
        "Black's pawns on light squares"
      ],
      [
        "plan",
        "White's pawns on dark squares"
      ]
    ],
    "body": [
      "Both sides have one here. Black's bishop on c8 travels light squares, and his pawns on d5, e6 and f7 are all light. White's bishop on c1 travels dark squares, and his chain c3, d4, e5 is all dark. The opening, not the middlegame, is where each player agreed to this.",
      "The label settles nothing by itself. What matters is whether the bishop can get outside its own chain. Black's usual route is Bd7 and Bb5, or b6 and Ba6, trading the thing off rather than nursing it. White's bishop still has e3 and g5, so it is restricted without being buried.",
      "Two consequences at the board. First, choosing an opening is choosing which bishop you will live with, so a structure that hands you a bad one needs a plan for it before you play into it. Second, the fix is usually the pawn structure rather than the piece: getting one pawn off your bishop's color does more than finding the bishop a marginally better square.",
      "Mihai Suba's line is worth keeping in mind as a check on the whole idea. Bad bishops protect good pawns. A bishop sitting behind its pawns is doing defensive work, and trading it can leave what it was guarding loose."
    ]
  },
  {
    "name": "Control of the center",
    "tagline": "Pawns and pieces on or aimed at d4, d5, e4 and e5.",
    "fen": "r1bqkbnr/pppp1ppp/2n5/4p3/3PP3/5N2/PPP2PPP/RNBQKB1R",
    "turn": "Scotch Game, after 3.d4",
    "marks": {
      "f3": "plan",
      "c6": "plan",
      "d5": "target",
      "e5": "target",
      "d4": "subject",
      "e4": "subject"
    },
    "legend": [
      [
        "subject",
        "White's center pawns"
      ],
      [
        "target",
        "the other two center squares"
      ],
      [
        "plan",
        "knights aimed at the center"
      ]
    ],
    "body": [
      "Pieces placed in the center reach both wings fastest, so the first moves of nearly every opening fight for these four squares, by occupying them or by aiming at them."
    ]
  },
  {
    "name": "King pawn opening",
    "tagline": "1.e4.",
    "fen": "rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR",
    "turn": "After 1.e4",
    "marks": {
      "f1": "zone",
      "d1": "zone",
      "d5": "plan",
      "f5": "plan",
      "e4": "subject"
    },
    "legend": [
      [
        "subject",
        "the king pawn"
      ],
      [
        "plan",
        "squares it controls"
      ],
      [
        "zone",
        "the queen and bishop it frees"
      ]
    ],
    "body": [
      "The king pawn takes two center squares and opens lines for the queen and the king's bishop at once. The positions tend to open early and turn on tactics and development."
    ]
  },
  {
    "name": "Queen pawn opening",
    "tagline": "1.d4.",
    "fen": "rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR",
    "turn": "After 1.d4",
    "marks": {
      "c1": "zone",
      "d1": "zone",
      "c5": "plan",
      "e5": "plan",
      "d4": "subject"
    },
    "legend": [
      [
        "subject",
        "the queen pawn"
      ],
      [
        "plan",
        "squares it controls"
      ],
      [
        "zone",
        "the bishop and queen it frees"
      ]
    ],
    "body": [
      "Unlike e4, the pawn on d4 is already guarded by the queen. Queen pawn games tend to be slower and more positional, with c4 often following to fight for d5."
    ]
  },
  {
    "name": "Open and closed games",
    "tagline": "1.e4 e5 is an open game; 1.d4 d5 a closed one.",
    "fen": "rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR",
    "turn": "An open game, after 1...e5",
    "marks": {
      "e4": "subject",
      "e5": "subject"
    },
    "legend": [
      [
        "subject",
        "the king pawns, face to face"
      ]
    ],
    "body": [
      "The names sort openings by the first moves: open games start 1.e4 e5, closed games 1.d4 d5. An open position is a different idea, one with open files and few center pawns, and a closed opening can still produce one."
    ]
  },
  {
    "name": "Semi-closed games",
    "tagline": "1.d4 answered by anything but 1...d5.",
    "fen": "rnbqkb1r/pppppppp/5n2/8/3P4/8/PPP1PPPP/RNBQKBNR",
    "turn": "After 1...Nf6",
    "marks": {
      "e4": "plan",
      "f6": "target",
      "d4": "subject"
    },
    "legend": [
      [
        "subject",
        "White's queen pawn"
      ],
      [
        "target",
        "Black's knight"
      ],
      [
        "plan",
        "the square it stops White taking with a pawn"
      ]
    ],
    "body": [
      "The Indian defenses start here. Black controls e4 with a piece instead of meeting d4 with a pawn. The mirror, 1.e4 answered by anything but 1...e5, is called semi-open."
    ]
  }
];

const GLYPH = { k: "\u265A", q: "\u265B", r: "\u265C", b: "\u265D", n: "\u265E", p: "\u265F" };
const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];

function parseFen(fen) {
  const rows = fen.split(" ")[0].split("/");
  const out = {};
  rows.forEach((row, i) => {
    const rank = 8 - i;
    let file = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { file += parseInt(ch, 10); continue; }
      out[FILES[file] + rank] = ch;
      file += 1;
    }
  });
  return out;
}

function drawBoard(term) {
  const pieces = parseFen(term.fen);
  const board = document.getElementById("board");
  board.textContent = "";
  for (let rank = 8; rank >= 1; rank--) {
    for (let f = 0; f < 8; f++) {
      const name = FILES[f] + rank;
      const sq = document.createElement("div");
      sq.className = "sq " + (((f + rank) % 2 === 0) ? "l" : "d");
      sq.dataset.sq = name;
      if (term.marks[name]) sq.dataset.mark = term.marks[name];
      if (term.numbers && term.numbers[name] !== undefined) {
        // a count on the square, and a wash that deepens with it
        const vals = Object.values(term.numbers);
        const lo = Math.min(...vals), hi = Math.max(...vals);
        const heat = document.createElement("div");
        heat.className = "heat";
        heat.style.opacity = (hi === lo ? 0.5 : 0.12 + 0.6 * (term.numbers[name] - lo) / (hi - lo)).toFixed(3);
        sq.appendChild(heat);
        sq.dataset.n = term.numbers[name];
      }
      const p = pieces[name];
      if (p) {
        const span = document.createElement("span");
        span.className = "pc " + (p === p.toUpperCase() ? "w" : "b");
        span.textContent = GLYPH[p.toLowerCase()];
        sq.appendChild(span);
      } else if (sq.dataset.n !== undefined) {
        const n = document.createElement("span");
        n.className = "num";
        n.textContent = sq.dataset.n;
        sq.appendChild(n);
      }
      board.appendChild(sq);
    }
  }
}

function render(index) {
  const term = TERMS[index];
  drawBoard(term);
  document.getElementById("turn").textContent = term.turn;
  document.getElementById("turn").hidden = !term.turn;
  document.getElementById("name").textContent = term.name;
  document.getElementById("tagline").textContent = term.tagline;

  const legend = document.getElementById("legend");
  legend.textContent = "";
  term.legend.forEach(([kind, label]) => {
    const row = document.createElement("div");
    const sw = document.createElement("span");
    sw.className = "swatch sw-" + kind;
    row.appendChild(sw);
    row.appendChild(document.createTextNode(label));
    legend.appendChild(row);
  });

  const body = document.getElementById("body");
  body.textContent = "";
  term.body.forEach(par => {
    const p = document.createElement("p");
    if (par.startsWith("|")) { p.className = "moves"; p.textContent = par.slice(1); }
    else p.textContent = par;
    body.appendChild(p);
  });

  document.querySelectorAll(".chip").forEach((c, i) => {
    c.setAttribute("aria-selected", i === index ? "true" : "false");
  });
  current = index;
}

const chips = document.getElementById("chips");
TERMS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.setAttribute("role", "tab");
  b.textContent = t.name;
  b.addEventListener("click", () => render(i));
  chips.appendChild(b);
});

const ranks = document.getElementById("ranks");
for (let r = 8; r >= 1; r--) {
  const s = document.createElement("span");
  s.textContent = r;
  ranks.appendChild(s);
}
const filesEl = document.getElementById("files");
FILES.forEach(f => {
  const s = document.createElement("span");
  s.textContent = f;
  filesEl.appendChild(s);
});

let current = 0;
render(0);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") render((current + 1) % TERMS.length);
  if (e.key === "ArrowLeft") render((current - 1 + TERMS.length) % TERMS.length);
});

// for the verifier: pick a term, report what the page is showing
window.__terms = function (q) {
  if (q && Number.isInteger(q.pick)) render(q.pick);
  const sq = [...document.querySelectorAll("#board .sq")];
  return {
    current, count: TERMS.length,
    chips: document.querySelectorAll(".chip").length,
    squares: sq.length,
    a1: document.querySelector('#board .sq[data-sq="a1"]').className,
    h1: document.querySelector('#board .sq[data-sq="h1"]').className,
    pieces: sq.filter(s => s.querySelector(".pc")).map(s => s.dataset.sq + ":" +
      (s.querySelector(".pc").classList.contains("w") ? "w" : "b") + s.querySelector(".pc").textContent),
    marks: sq.filter(s => s.dataset.mark).map(s => s.dataset.sq + ":" + s.dataset.mark),
    numbers: Object.fromEntries(sq.filter(s => s.dataset.n !== undefined).map(s => [s.dataset.sq, +s.dataset.n])),
    legend: document.querySelectorAll("#legend > div").length,
    name: document.getElementById("name").textContent,
    turn: document.getElementById("turn").textContent,
    paras: document.querySelectorAll("#body p").length,
    selected: [...document.querySelectorAll(".chip")].findIndex(c => c.getAttribute("aria-selected") === "true"),
  };
};
</script>
</body>
</html>
