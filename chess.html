<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess · Altazor</title>
<link rel="alternate" type="application/rss+xml" title="Altazor · Notes" href="feed.xml">
<style>
:root {
  --bg: #121212;
  --panel: #1a1a1a;
  --text: #e6e6e6;
  --muted: #9a9a9a;
  --line: #2b2b2b;
  --accent: #58a6ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
.wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 32px 20px 80px;
}
header.site {
  border-top: 4px solid var(--accent);
  padding-top: 22px;
  margin-bottom: 34px;
  display: flex;
  align-items: baseline;
  gap: 18px;
  flex-wrap: wrap;
}
.brand {
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.1em;
  text-decoration: none;
  color: var(--text);
}
.brand:hover { color: var(--accent); }
nav.site { display: flex; gap: 14px; flex-wrap: wrap; }
nav.site a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
}
nav.site a:hover, nav.site a.here { color: var(--accent); }
h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; }
.lede { color: var(--muted); max-width: 640px; margin: 6px 0 30px; font-size: 15px; }
a { color: var(--accent); }

/* Landing cards */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}
.card {
  display: block;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 20px 20px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.15s, border-color 0.15s;
}
.card:hover { transform: translateY(-3px); border-color: var(--accent); }
.card .num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.card h3 { margin: 8px 0 7px; font-size: 18px; }
.card p { margin: 0; font-size: 13.5px; color: var(--muted); }

/* Section and article pages */
.section-body, article {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.05rem;
  line-height: 1.7;
  max-width: 40rem;
}
.section-body p, article p { margin: 0 0 1.1rem; }
article h1 { font-family: Georgia, "Times New Roman", serif; }
time, .date {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 13px;
  color: var(--muted);
}
.post-body { margin-top: 1.6rem; }
ul.post-list { list-style: none; padding: 0; margin: 0; max-width: 40rem; }
ul.post-list li { padding: 1rem 0; border-bottom: 1px solid var(--line); }
ul.post-list li:first-child { border-top: 1px solid var(--line); }
ul.post-list a {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 1.15rem;
  color: var(--text);
  text-decoration: none;
}
ul.post-list a:hover { color: var(--accent); }
ul.post-list .date { display: block; margin-top: 0.2rem; }
figure { margin: 2rem 0; text-align: center; }
figure svg { max-width: 100%; height: auto; }
figcaption { font-size: 13px; color: var(--muted); margin-top: 0.6rem; }
img { max-width: 100%; }
code {
  font-family: Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--panel);
  padding: 0.1em 0.3em;
  border-radius: 3px;
}
pre { background: var(--panel); padding: 1rem; overflow-x: auto; border-radius: 6px; }
pre code { background: none; padding: 0; }
blockquote {
  margin: 1.5rem 0;
  padding-left: 1rem;
  border-left: 3px solid var(--line);
  color: var(--muted);
}
.bilingual { margin: 2rem 0; }
.bilingual .pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 1.6rem;
}
.bilingual .pair p { margin: 0 0 1.1rem; }
.bilingual p[lang="en"] { color: var(--muted); }
@media (max-width: 40rem) {
  .bilingual .pair { grid-template-columns: 1fr; }
  .bilingual .pair p { margin-bottom: 0.3rem; }
  .bilingual .pair p[lang="en"] { margin-bottom: 1.1rem; }
}
footer.site {
  margin-top: 60px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}
footer.site a { color: var(--muted); }
footer.site a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <a class="brand" href="index.html">ALTAZOR</a>
  <nav class="site"><a href="library.html">Library</a>
<a href="film.html">Film</a>
<a href="chess.html" class="here">Chess</a>
<a href="notes.html">Notes</a>
<a href="elsewhere.html">Elsewhere</a></nav>
</header>
<h1>Chess</h1>
<div class="section-body">

</div>
<footer class="site"><a href="index.html">Altazor</a></footer>
</div>
</body>
</html>
