<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altazor</title>
<link rel="alternate" type="application/rss+xml" title="Altazor" href="./feed.xml">
<style>
:root {
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --bg: #ffffff;
  --rule: #e4e4e4;
  --link: #1a1a1a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 1.05rem;
  line-height: 1.65;
}
main {
  max-width: 40rem;
  margin: 0 auto;
  padding: 3rem 1.25rem 5rem;
}
header.site {
  margin-bottom: 3rem;
}
header.site a {
  font-family: Helvetica, Arial, sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--text);
}
h1 {
  font-size: 1.7rem;
  line-height: 1.25;
  margin: 0 0 0.35rem;
}
h2 { font-size: 1.25rem; margin-top: 2.2rem; }
h3 { font-size: 1.05rem; margin-top: 1.8rem; }
a { color: var(--link); }
time, .date {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 0.82rem;
  color: var(--muted);
}
article.post-body { margin-top: 2rem; }
ul.post-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
ul.post-list li {
  padding: 1.1rem 0;
  border-bottom: 1px solid var(--rule);
}
ul.post-list li:first-child { border-top: 1px solid var(--rule); }
ul.post-list a {
  font-size: 1.15rem;
  text-decoration: none;
}
ul.post-list a:hover { text-decoration: underline; }
ul.post-list .date { display: block; margin-top: 0.2rem; }
figure { margin: 2rem 0; text-align: center; }
figure svg { max-width: 100%; height: auto; }
figcaption {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 0.82rem;
  color: var(--muted);
  margin-top: 0.6rem;
}
img { max-width: 100%; }
code {
  font-family: Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: #f4f4f4;
  padding: 0.1em 0.3em;
  border-radius: 3px;
}
pre {
  background: #f4f4f4;
  padding: 1rem;
  overflow-x: auto;
  border-radius: 4px;
}
pre code { background: none; padding: 0; }
blockquote {
  margin: 1.5rem 0;
  padding-left: 1rem;
  border-left: 3px solid var(--rule);
  color: var(--muted);
}
.bilingual { margin: 2rem 0; }
.bilingual .pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 1.6rem;
}
.bilingual .pair p { margin: 0 0 1.1rem; }
.bilingual p[lang="en"] { color: var(--muted); }
@media (max-width: 40rem) {
  .bilingual .pair { grid-template-columns: 1fr; }
  .bilingual .pair p { margin-bottom: 0.3rem; }
  .bilingual .pair p[lang="en"] { margin-bottom: 1.1rem; }
}
footer.site {
  margin-top: 4rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--rule);
  font-family: Helvetica, Arial, sans-serif;
  font-size: 0.82rem;
  color: var(--muted);
}
footer.site a { color: var(--muted); }
</style>
</head>
<body>
<main>
<header class="site"><a href="./">Altazor</a></header>
<ul class="post-list">
<li><a href="hello.html">Hello World!</a><time class="date" datetime="2026-08-09">August 9, 2026</time></li>
</ul>
<footer class="site"><a href="./feed.xml">RSS</a></footer>
</main>
</body>
</html>
