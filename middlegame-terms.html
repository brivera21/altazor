<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middlegame Terms &middot; Altazor</title>
<meta name="description" content="Terms from the middlegame, each on the position that shows it.">
<style>
:root { --bg:#121212; --panel:#1a1a1a; --text:#e6e6e6; --muted:#9a9a9a;
        --line:#2b2b2b; --accent:#58a6ff;
        --sq-light:#a9b2be; --sq-dark:#5a6472;
        --subject:#f09b28; --target:#e0684b; --plan:#58a6ff; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; }
.wrap { max-width:1240px; margin:0 auto; padding:32px 20px 60px; }
header.site { border-top:4px solid var(--accent); padding-top:22px; margin-bottom:26px;
  display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; }
.brand { font-weight:700; font-size:20px; letter-spacing:.1em; text-decoration:none;
  color:var(--text); }
.brand:hover { color:var(--accent); }
nav.site a { color:var(--muted); text-decoration:none; font-size:14px; margin-right:14px; }
nav.site a:hover { color:var(--accent); }
h1 { margin:0 0 14px; font-size:26px; }

.controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 18px; }
.chip { font:inherit; font-size:13.5px; padding:6px 14px; border-radius:999px;
  border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
.chip:hover { border-color:var(--accent); }
.chip[aria-selected="true"] { background:var(--accent); border-color:var(--accent);
  color:#0b1a2b; font-weight:600; }
.keys { color:var(--muted); font-size:12.5px; margin-left:6px; }

.boardcol { max-width:560px; }
.board-grid { display:grid;
  grid-template-columns:1.4em min(86vw, 520px);
  grid-template-rows:min(86vw, 520px) 1.4em;
  align-items:center; justify-items:center; }
.ranks, .files { display:grid; width:100%; height:100%; }
.ranks { grid-template-rows:repeat(8, 1fr); }
.files { grid-template-columns:repeat(8, 1fr); grid-column:2; }
.ranks span, .files span { display:flex; align-items:center; justify-content:center;
  font-size:11px; color:#7c7c7c; font-variant-numeric:tabular-nums; }
.board { display:grid; grid-template-columns:repeat(8, 1fr); grid-template-rows:repeat(8, 1fr);
  width:100%; height:100%; border:1px solid #333; border-radius:4px; overflow:hidden; }
.sq { position:relative; display:flex; align-items:center; justify-content:center; }
.sq.l { background:var(--sq-light); }
.sq.d { background:var(--sq-dark); }
.sq[data-mark]::after { content:""; position:absolute; inset:0;
  box-shadow:inset 0 0 0 3px currentColor; background:currentColor; opacity:.38; }
.sq[data-mark="subject"] { color:var(--subject); }
.sq[data-mark="target"] { color:var(--target); }
.sq[data-mark="plan"] { color:var(--plan); }
.pc { position:relative; z-index:1; font-size:min(10vw, 56px); line-height:1; user-select:none; }
.pc.w { color:#f6f6f4; -webkit-text-stroke:1.3px #15181c; text-shadow:0 0 1px #15181c; }
.pc.b { color:#15181c; text-shadow:0 0 2px rgba(255,255,255,.35); }

.turn { font-size:13px; color:var(--muted); margin:10px 0 0 1.4em; }
.legend { display:flex; flex-wrap:wrap; gap:6px 18px; margin:12px 0 0 1.4em; }
.legend div { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
.swatch { width:13px; height:13px; border-radius:3px; background:currentColor; opacity:.6;
  box-shadow:inset 0 0 0 2px currentColor; }
.sw-subject { color:var(--subject); }
.sw-target { color:var(--target); }
.sw-plan { color:var(--plan); }

.text { margin:30px 0 0; border-top:1px solid var(--line); padding-top:22px; max-width:72ch; }
.text h2 { font-size:21px; margin:0 0 2px; font-weight:650; }
.tagline { color:var(--muted); margin:0 0 16px; }
.text p { margin:0 0 14px; color:#d4d4d4; }
.moves { font-variant-numeric:tabular-nums; }

footer.site { margin-top:60px; padding-top:18px; border-top:1px solid var(--line);
  font-size:13px; color:var(--muted); }
footer.site a { color:var(--muted); }
footer.site a:hover { color:var(--accent); }
@media (max-width:520px) {
  .board-grid { grid-template-columns:1.2em min(90vw, 520px); grid-template-rows:min(90vw, 520px) 1.2em; }
  .pc.w { -webkit-text-stroke:.8px #15181c; }
}
</style>
</head>
<body>
<div class="wrap">
<header class="site">
  <a class="brand" href="index.html">ALTAZOR</a>
  <nav class="site"><a href="chess.html">&larr; Chess</a>
  <a href="opening-terms.html">Opening Terms</a>
  <a href="endgame-terms.html">Endgame Terms</a></nav>
</header>
<h1>Middlegame Terms</h1>
<div class="controls">
  <div class="chips" id="chips" role="tablist" style="display:contents"></div>
  <span class="keys">Arrow keys step through the terms.</span>
</div>

<div class="boardcol">
  <div class="board-grid">
    <div class="ranks" id="ranks"></div>
    <div class="board" id="board" role="img" aria-label="The position for the selected term"></div>
    <div class="files" id="files"></div>
  </div>
  <p class="turn" id="turn"></p>
  <div class="legend" id="legend"></div>
</div>

<div class="text diagram-text">
  <h2 id="name"></h2>
  <p class="tagline" id="tagline"></p>
  <div id="body"></div>
</div>

<footer class="site"><a href="index.html">Altazor</a> &middot; <a href="chess.html">Chess</a> &middot; Middle Games</footer>
</div>

<script>
const TERMS = [
  {
    "name": "Outpost",
    "tagline": "A square in his half that no pawn of his can ever attack again.",
    "fen": "r4rk1/1bq1bppp/p2p4/1p1Np3/4P3/3B4/PPPQ1PPP/R4RK1",
    "turn": "Sicilian structure, Black to move",
    "marks": {
      "d5": "subject",
      "c6": "target",
      "e6": "target",
      "e5": "plan"
    },
    "legend": [
      [
        "subject",
        "the outpost"
      ],
      [
        "target",
        "squares no black pawn can reach"
      ],
      [
        "plan",
        "the pawn that gave it up"
      ]
    ],
    "body": [
      "The knight on d5 is not visiting. Count the pawns that could ever attack that square: the c-pawn was traded early, and the e-pawn has gone to e5, past it. Neither can come back. Only a piece can remove the knight, and every piece trade of that kind costs Black something.",
      "So the question is short, and it is about pawns rather than pieces. Which squares can his pawns never attack again? Traded pawns and advanced pawns both make them, which is why the same knight maneuver keeps appearing in the same structures.",
      "What justifies the time it takes to get there is what happens after the trade. If Black plays Bxd5, White answers exd5 and a pawn takes the square over, gaining space and keeping Black's pieces out of it. The square stays White's whichever way the exchanges go."
    ]
  },
  {
    "name": "Hook",
    "tagline": "A pawn of his that gives your pawn something to hit.",
    "fen": "r4rk1/pp1bppbp/2np1np1/q7/2BNP2P/2N1BP2/PPPQ2P1/2KR3R",
    "turn": "Opposite castling, White to move",
    "marks": {
      "g6": "subject",
      "h4": "plan",
      "h5": "plan",
      "h7": "target"
    },
    "legend": [
      [
        "subject",
        "the hook"
      ],
      [
        "plan",
        "h4-h5, the move it allows"
      ],
      [
        "target",
        "what the open file reaches"
      ]
    ],
    "body": [
      "White plays h4-h5, and it works only because g6 is there to make contact. If Black takes on h5, the h-file opens toward h7. If he leaves it, hxg6 opens the same file. One pawn move buys the line either way.",
      "Clear g6 and h7 off the board and White has nothing to open with. Pawns cannot attack empty squares, so an attack with no hook has to be carried by pieces alone, which is much slower.",
      "This is the part that changes a decision you actually face. Before pushing a pawn near your own king, h6 against a queenside castle, a6 against a kingside attack, ask what it hands the attacker to hit. And use it when counting: an attack with a hook usually lands a move or two sooner, and in opposite-castling positions a move or two is the whole game."
    ]
  },
  {
    "name": "Lever",
    "tagline": "Pawn contact. Without it, nothing opens.",
    "fen": "r3r1k1/ppq2ppp/2pb1n2/3p4/3P4/3BPN2/PPQ2PPP/1RR3K1",
    "turn": "Carlsbad structure, White to move",
    "marks": {
      "b2": "subject",
      "b4": "plan",
      "b5": "plan",
      "c6": "target",
      "c5": "subject"
    },
    "legend": [
      [
        "subject",
        "the pawns that can make contact"
      ],
      [
        "plan",
        "b4-b5, White's lever"
      ],
      [
        "target",
        "the pawn it hits"
      ]
    ],
    "body": [
      "Carlsbad structure from the Exchange Queen's Gambit Declined. White has two queenside pawns against three, and b4 then b5 makes contact with c6. After the trade Black has either a weak c-pawn or an open file to defend, and White has a target he manufactured himself. That is the minority attack, and its point is not material, it is making a weakness where there was none.",
      "Black's levers are c6-c5 against d4, and the slower f7-f5 and f4 against e3. Both open the side of the board where his pieces are better placed.",
      "In any position where nothing can be captured, list the pawn contacts available to each side. That list is usually the complete set of plans, and it is shorter than it feels. Pieces then go wherever the lever you intend needs them, rather than the other way around."
    ]
  },
  {
    "name": "Prophylaxis",
    "tagline": "A move spent on his plan instead of your own.",
    "fen": "r1bq1rk1/2p1bppp/p1np1n2/1p2p3/4P3/1BP2N2/PP1P1PPP/RNBQR1K1",
    "turn": "Closed Ruy Lopez after 8...O-O, White to move",
    "marks": {
      "h2": "plan",
      "h3": "plan",
      "g4": "target",
      "f3": "subject",
      "d4": "subject"
    },
    "legend": [
      [
        "plan",
        "9.h3"
      ],
      [
        "target",
        "the square it takes away"
      ],
      [
        "subject",
        "what White wants next"
      ]
    ],
    "body": [
      "White's move here is 9.h3. It develops nothing, attacks nothing and threatens nothing. It takes g4 away, because White intends d2-d4 and does not want Bg4 leaning on the knight that holds the center together.",
      "The habit worth building is small. Before choosing a move, name his best next move. Often one quiet pawn move makes it impossible, and you end up in a position where you have every plan and he has none. Karpov built a career on this and Petrosian built one on it before him.",
      "It costs a tempo, so it is right only when his plan is real. A prophylactic move against something he was never going to do is just a slow move, and you will usually find that out two moves later."
    ]
  }
];

const GLYPH = { k: "\u265A", q: "\u265B", r: "\u265C", b: "\u265D", n: "\u265E", p: "\u265F" };
const FILES = ["a", "b", "c", "d", "e", "f", "g", "h"];

function parseFen(fen) {
  const rows = fen.split(" ")[0].split("/");
  const out = {};
  rows.forEach((row, i) => {
    const rank = 8 - i;
    let file = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { file += parseInt(ch, 10); continue; }
      out[FILES[file] + rank] = ch;
      file += 1;
    }
  });
  return out;
}

function drawBoard(term) {
  const pieces = parseFen(term.fen);
  const board = document.getElementById("board");
  board.textContent = "";
  for (let rank = 8; rank >= 1; rank--) {
    for (let f = 0; f < 8; f++) {
      const name = FILES[f] + rank;
      const sq = document.createElement("div");
      sq.className = "sq " + (((f + rank) % 2 === 0) ? "l" : "d");
      sq.dataset.sq = name;
      if (term.marks[name]) sq.dataset.mark = term.marks[name];
      const p = pieces[name];
      if (p) {
        const span = document.createElement("span");
        span.className = "pc " + (p === p.toUpperCase() ? "w" : "b");
        span.textContent = GLYPH[p.toLowerCase()];
        sq.appendChild(span);
      }
      board.appendChild(sq);
    }
  }
}

function render(index) {
  const term = TERMS[index];
  drawBoard(term);
  document.getElementById("turn").textContent = term.turn;
  document.getElementById("name").textContent = term.name;
  document.getElementById("tagline").textContent = term.tagline;

  const legend = document.getElementById("legend");
  legend.textContent = "";
  term.legend.forEach(([kind, label]) => {
    const row = document.createElement("div");
    const sw = document.createElement("span");
    sw.className = "swatch sw-" + kind;
    row.appendChild(sw);
    row.appendChild(document.createTextNode(label));
    legend.appendChild(row);
  });

  const body = document.getElementById("body");
  body.textContent = "";
  term.body.forEach(par => {
    const p = document.createElement("p");
    if (par.startsWith("|")) { p.className = "moves"; p.textContent = par.slice(1); }
    else p.textContent = par;
    body.appendChild(p);
  });

  document.querySelectorAll(".chip").forEach((c, i) => {
    c.setAttribute("aria-selected", i === index ? "true" : "false");
  });
  current = index;
}

const chips = document.getElementById("chips");
TERMS.forEach((t, i) => {
  const b = document.createElement("button");
  b.className = "chip";
  b.type = "button";
  b.setAttribute("role", "tab");
  b.textContent = t.name;
  b.addEventListener("click", () => render(i));
  chips.appendChild(b);
});

const ranks = document.getElementById("ranks");
for (let r = 8; r >= 1; r--) {
  const s = document.createElement("span");
  s.textContent = r;
  ranks.appendChild(s);
}
const filesEl = document.getElementById("files");
FILES.forEach(f => {
  const s = document.createElement("span");
  s.textContent = f;
  filesEl.appendChild(s);
});

let current = 0;
render(0);

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") render((current + 1) % TERMS.length);
  if (e.key === "ArrowLeft") render((current - 1 + TERMS.length) % TERMS.length);
});

// for the verifier: pick a term, report what the page is showing
window.__terms = function (q) {
  if (q && Number.isInteger(q.pick)) render(q.pick);
  const sq = [...document.querySelectorAll("#board .sq")];
  return {
    current, count: TERMS.length,
    chips: document.querySelectorAll(".chip").length,
    squares: sq.length,
    a1: document.querySelector('#board .sq[data-sq="a1"]').className,
    h1: document.querySelector('#board .sq[data-sq="h1"]').className,
    pieces: sq.filter(s => s.querySelector(".pc")).map(s => s.dataset.sq + ":" +
      (s.querySelector(".pc").classList.contains("w") ? "w" : "b") + s.querySelector(".pc").textContent),
    marks: sq.filter(s => s.dataset.mark).map(s => s.dataset.sq + ":" + s.dataset.mark),
    legend: document.querySelectorAll("#legend > div").length,
    name: document.getElementById("name").textContent,
    turn: document.getElementById("turn").textContent,
    paras: document.querySelectorAll("#body p").length,
    selected: [...document.querySelectorAll(".chip")].findIndex(c => c.getAttribute("aria-selected") === "true"),
  };
};
</script>
</body>
</html>
